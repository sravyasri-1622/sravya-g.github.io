<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Password Validator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        input {
            padding: 10px;
            width: 280px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<h2>Strong Password Validator</h2>

<input type="password" id="password" placeholder="Enter password">
<button onclick="checkPassword()">Check</button>

<p id="result"></p>

<a href="index.html">← Back to Programs</a>

<script>
function checkPassword() {

    let password = document.getElementById("password").value;
    let result = document.getElementById("result");

    let hasUpper = /[A-Z]/.test(password);
    let hasLower = /[a-z]/.test(password);
    let hasNumber = /[0-9]/.test(password);

    if (password.length >= 8 && hasUpper && hasLower && hasNumber) {
        result.textContent = "Strong password.";
    } else {
        result.textContent =
            "Password must have 8 characters, uppercase, lowercase and a number.";
    }
}
</script>

</body>
</html>
