<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regular Expressions</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 550px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input,
        button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Regular Expression</h1>

        <p>
            Check whether the entered text contains only letters.
        </p>

        <input type="text" id="text"
            placeholder="Enter text">

        <button onclick="checkPattern()">
            Check
        </button>

        <p id="result"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function checkPattern() {

            let text = document.getElementById("text").value;

            let pattern = /^[A-Za-z]+$/;

            if (pattern.test(text)) {

                document.getElementById("result").innerHTML =
                    "Valid: Only letters are present.";

            } else {

                document.getElementById("result").innerHTML =
                    "Invalid: Use letters only.";

            }

        }

    </script>

</body>

</html>
