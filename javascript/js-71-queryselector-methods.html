<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>querySelector Methods</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        .item {
            padding: 12px;
            margin: 8px;
            background: #f1f5f9;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>querySelector()</h1>

        <p class="item">Item One</p>
        <p class="item">Item Two</p>
        <p class="item">Item Three</p>

        <button onclick="selectElements()">
            Select Elements
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function selectElements() {

            let first =
                document.querySelector(".item");

            first.style.color = "#dc2626";
            first.style.fontWeight = "bold";

            let all =
                document.querySelectorAll(".item");

            for (let i = 0; i < all.length; i++) {

                all[i].style.border =
                    "2px solid #2563eb";

            }

        }

    </script>

</body>

</html>
