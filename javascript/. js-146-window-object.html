<!DOCTYPE html>
<html>
<head>
    <title>Window Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Window Object</h1>

    <p id="output">Click a button to see Window object information.</p>

    <button onclick="showWindow()">Show Window Info</button>
    <button onclick="openWindow()">Open New Window</button>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function showWindow() {
    document.getElementById("output").innerHTML =
        "Window Width: " + window.innerWidth +
        "<br>Window Height: " + window.innerHeight;
}

function openWindow() {
    window.open("https://www.example.com", "_blank");
}
</script>

</body>
</html>
