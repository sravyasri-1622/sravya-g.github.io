<!DOCTYPE html>
<html>
<head>
    <title>Current URL</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 700px;
            margin: auto;
            border-radius: 15px;
        }

        #url {
            word-break: break-all;
            margin: 20px;
            padding: 15px;
            background: #eeeeee;
        }

        button {
            padding: 10px 20px;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Current Webpage URL</h1>

    <div id="url"></div>

    <button onclick="showURL()">Show Current URL</button>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function showURL() {
    document.getElementById("url").innerHTML =
        window.location.href;
}

showURL();
</script>

</body>
</html>
