<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Background Color</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
            transition: 0.4s;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        button {
            padding: 10px 20px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #6d28d9;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Change Background Color</h1>

        <p>
            Click the button to change the background color.
        </p>

        <button onclick="changeColor()">
            Change Color
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function changeColor() {

            document.body.style.backgroundColor = "#dbeafe";

        }

    </script>

</body>

</html>
