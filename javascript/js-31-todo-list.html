<!DOCTYPE html>
<html>
<head>
    <title>JavaScript - To Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 40px 20px;
        }

        .todo {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input {
            width: 70%;
            padding: 12px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        li {
            margin: 12px 0;
            padding: 10px;
            background: #eef2ff;
        }

        a {
            display: block;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<div class="todo">

    <h1>To-Do List</h1>

    <input type="text" id="task" placeholder="Enter a task">

    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

    <a href="index.html">← Back to JavaScript Programs</a>
    <a href="../index.html">← Home</a>

</div>

<script>

function addTask() {

    let task = document.getElementById("task").value;

    if (task === "") {
        alert("Please enter a task.");
        return;
    }

    let li = document.createElement("li");

    li.innerHTML = task;

    document.getElementById("taskList").appendChild(li);

    document.getElementById("task").value = "";
}

</script>

</body>
</html>
