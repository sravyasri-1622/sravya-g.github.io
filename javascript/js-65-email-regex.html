<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Validation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 550px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input,
        button {
            padding: 10px;
            margin: 8px;
        }

        input {
            width: 80%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Email Validation</h1>

        <input type="text" id="email"
            placeholder="Enter email address">

        <button onclick="validateEmail()">
            Validate
        </button>

        <p id="result"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function validateEmail() {

            let email = document.getElementById("email").value;

            let pattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (pattern.test(email)) {

                document.getElementById("result").innerHTML =
                    "Valid email address.";

            } else {

                document.getElementById("result").innerHTML =
                    "Invalid email address.";

            }

        }

    </script>

</body>

</html>
