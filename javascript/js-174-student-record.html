<!DOCTYPE html>
<html>
<head>
    <title>Student Record System</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Student Record System</h1>

    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="roll" placeholder="Roll Number">

    <br>

    <button onclick="saveStudent()">Save Record</button>
    <button onclick="displayStudent()">Display Record</button>

    <div id="result"></div>

    <br>
    <a href="index.html">← Back to Programs</a>

    <script>
        function saveStudent() {
            var student = {
                name: document.getElementById("name").value,
                roll: document.getElementById("roll").value
            };

            localStorage.setItem("studentRecord", JSON.stringify(student));

            document.getElementById("result").innerHTML =
                "Student record saved.";
        }

        function displayStudent() {
            var data = localStorage.getItem("studentRecord");

            if (data) {
                var student = JSON.parse(data);

                document.getElementById("result").innerHTML =
                    "Name: " + student.name +
                    "<br>Roll Number: " + student.roll;
            } else {
                document.getElementById("result").innerHTML =
                    "No student record found.";
            }
        }
    </script>

</body>
</html>
