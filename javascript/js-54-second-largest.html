<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Second Largest</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 550px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input,
        button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Second Largest Element</h1>

        <input type="text" id="array"
            placeholder="10, 25, 5, 40, 30">

        <button onclick="findSecondLargest()">
            Find
        </button>

        <p id="result"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function findSecondLargest() {

            let array = document.getElementById("array").value
                .split(",")
                .map(Number);

            array.sort(function(a, b) {
                return b - a;
            });

            let unique = [...new Set(array)];

            if (unique.length < 2) {

                document.getElementById("result").innerHTML =
                    "At least two different numbers are required.";

            } else {

                document.getElementById("result").innerHTML =
                    "Second largest = " + unique[1];

            }

        }

    </script>

</body>

</html>
