<!DOCTYPE html>
<html>
<head>
    <title>JavaScript - Digital Clock</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #111827;
            color: white;
            padding: 60px 20px;
        }

        .clock-box {
            max-width: 500px;
            margin: auto;
            background: #1f2937;
            padding: 40px;
            border-radius: 20px;
        }

        #clock {
            font-size: 50px;
            font-weight: bold;
            margin: 30px;
        }

        a {
            color: white;
            display: block;
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="clock-box">

    <h1>Digital Clock</h1>

    <div id="clock"></div>

    <a href="index.html">← Back to JavaScript Programs</a>
    <a href="../index.html">← Home</a>

</div>

<script>

function showTime() {

    let now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    hours = hours < 10 ? "0" + hours : hours;
    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;

    document.getElementById("clock").innerHTML =
        hours + ":" + minutes + ":" + seconds;
}

setInterval(showTime, 1000);

showTime();

</script>

</body>
</html>
