<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Table Data</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ccc;
        }

        th {
            background: #2563eb;
            color: white;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #16a34a;
            color: white;
            cursor: pointer;
        }

        input {
            padding: 7px;
            width: 90%;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Edit Table Data</h1>

        <table id="studentTable">

            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>Sravya</td>
                <td>CSE</td>
                <td>
                    <button onclick="editRow(this)">
                        Edit
                    </button>
                </td>
            </tr>

            <tr>
                <td>Prasanna</td>
                <td>IT</td>
                <td>
                    <button onclick="editRow(this)">
                        Edit
                    </button>
                </td>
            </tr>

        </table>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function editRow(button) {

            let row = button.parentNode.parentNode;

            let name = row.cells[0].innerText;
            let course = row.cells[1].innerText;

            row.cells[0].innerHTML =
                '<input type="text" value="' + name + '">';

            row.cells[1].innerHTML =
                '<input type="text" value="' + course + '">';

            button.innerText = "Save";

            button.onclick = function () {

                row.cells[0].innerText =
                    row.cells[0].children[0].value;

                row.cells[1].innerText =
                    row.cells[1].children[0].value;

                button.innerText = "Edit";

                button.onclick = function () {
                    editRow(button);
                };

            };

        }

    </script>

</body>

</html>
