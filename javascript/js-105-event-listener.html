<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Listener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        #output {
            font-weight: bold;
            margin-top: 20px;
        }

        a {
            display: block;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Event Listener</h1>

        <button id="clickButton">
            Click Me
        </button>

        <button id="removeButton">
            Remove Listener
        </button>

        <p id="output">
            Event listener is active.
        </p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        let button =
            document.getElementById("clickButton");

        let removeButton =
            document.getElementById("removeButton");

        let output =
            document.getElementById("output");

        function showMessage() {

            output.innerText =
                "Button clicked using addEventListener().";

        }

        button.addEventListener(
            "click",
            showMessage
        );

        removeButton.addEventListener(
            "click",
            function () {

                button.removeEventListener(
                    "click",
                    showMessage
                );

                output.innerText =
                    "Event listener removed.";

            }
        );

    </script>

</body>

</html>
