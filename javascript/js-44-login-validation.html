<!DOCTYPE html>
<html>
<head>
    <title>JavaScript - Login Validation</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            padding: 50px 20px;
        }

        .login {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            display: block;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Login</h1>

    <input type="text" id="username" placeholder="Username">

    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="message"></div>

    <a href="index.html">← Back to JavaScript Programs</a>
    <a href="../index.html">← Home</a>

</div>

<script>

function login() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "" || password === "") {

        document.getElementById("message").innerHTML =
            "❌ Please enter username and password.";

    } else {

        document.getElementById("message").innerHTML =
            "✅ Login validation successful!";
    }
}

</script>

</body>
</html>
