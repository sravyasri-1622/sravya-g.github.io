<!DOCTYPE html>
<html>
<head>
    <title>Back Forward Reload</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Browser History Operations</h1>

    <button onclick="goBack()">Back</button>
    <button onclick="goForward()">Forward</button>
    <button onclick="reloadPage()">Reload</button>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function goBack() {
    history.back();
}

function goForward() {
    history.forward();
}

function reloadPage() {
    location.reload();
}
</script>

</body>
</html>
