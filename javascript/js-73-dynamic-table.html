<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ccc;
        }

        th {
            background: #2563eb;
            color: white;
        }

        button {
            padding: 10px 20px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Dynamic Student Table</h1>

        <button onclick="createTable()">
            Create Table
        </button>

        <div id="tableContainer"></div>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function createTable() {

            let students = [
                ["Sravya", "CSE", "85"],
                ["Prasanna", "CSE", "90"],
                ["Deekshitha", "IT", "88"]
            ];

            let table =
                document.createElement("table");

            let header =
                document.createElement("tr");

            header.innerHTML =
                "<th>Name</th>" +
                "<th>Department</th>" +
                "<th>Marks</th>";

            table.appendChild(header);

            for (let i = 0; i < students.length; i++) {

                let row =
                    document.createElement("tr");

                row.innerHTML =
                    "<td>" + students[i][0] + "</td>" +
                    "<td>" + students[i][1] + "</td>" +
                    "<td>" + students[i][2] + "</td>";

                table.appendChild(row);

            }

            document.getElementById("tableContainer")
                .innerHTML = "";

            document.getElementById("tableContainer")
                .appendChild(table);

        }

    </script>

</body>

</html>
