<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Show Hide Element</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .show {
            background: #16a34a;
        }

        .hide {
            background: #dc2626;
        }

        #content {
            margin: 20px 0;
            padding: 20px;
            background: #e0f2fe;
            border-radius: 8px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Show / Hide Element</h1>

        <div id="content">
            This content can be shown or hidden using JavaScript.
        </div>

        <button class="show" onclick="showContent()">
            Show
        </button>

        <button class="hide" onclick="hideContent()">
            Hide
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function showContent() {

            document.getElementById("content").style.display = "block";

        }

        function hideContent() {

            document.getElementById("content").style.display = "none";

        }

    </script>

</body>

</html>
