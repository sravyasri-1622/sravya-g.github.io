<!DOCTYPE html>
<html>
<head>
    <title>Password Regex Validation</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
        }

        .box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }

        button {
            background: #222;
            color: white;
            border: none;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Password Regex Validation</h2>

    <input type="password" id="password" placeholder="Enter password">

    <button onclick="validatePassword()">Validate</button>

    <p id="msg"></p>

    <a href="index.html">Back to Programs</a>
</div>

<script>
function validatePassword() {
    let password = document.getElementById("password").value;

    let pattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}$/;

    if (pattern.test(password)) {
        document.getElementById("msg").innerHTML = "Valid Password";
        document.getElementById("msg").style.color = "green";
    } else {
        document.getElementById("msg").innerHTML =
            "Password must contain 8 characters, uppercase, lowercase and number.";
        document.getElementById("msg").style.color = "red";
    }
}
</script>

</body>
</html>
