<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>String Palindrome</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input,
        button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>String Palindrome</h1>

        <input type="text" id="text"
            placeholder="Enter a string">

        <button onclick="checkPalindrome()">Check</button>

        <p id="result"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function checkPalindrome() {

            let text = document.getElementById("text").value
                .toLowerCase();

            let reversed = text.split("").reverse().join("");

            if (text === reversed) {

                document.getElementById("result").innerHTML =
                    "It is a palindrome.";

            } else {

                document.getElementById("result").innerHTML =
                    "It is not a palindrome.";

            }

        }

    </script>

</body>

</html>
