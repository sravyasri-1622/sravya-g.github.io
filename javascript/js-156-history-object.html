<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>History Object</h1>

    <p id="output">Click the button to see history information.</p>

    <button onclick="showHistory()">Show History Length</button>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function showHistory() {
    document.getElementById("output").innerHTML =
        "Number of pages in browser history: " + history.length;
}
</script>

</body>
</html>
