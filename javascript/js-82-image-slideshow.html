<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Slideshow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 12px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Image Slideshow</h1>

        <img id="slide"
            src="../assets/images/web.jpg"
            alt="Slideshow Image">

        <br>

        <button onclick="previousImage()">
            Previous
        </button>

        <button onclick="nextImage()">
            Next
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        let images = [
            "../assets/images/web.jpg",
            "../assets/images/web.jpg",
            "../assets/images/web.jpg"
        ];

        let current = 0;

        function showImage() {

            document.getElementById("slide").src =
                images[current];

        }

        function nextImage() {

            current++;

            if (current >= images.length) {
                current = 0;
            }

            showImage();

        }

        function previousImage() {

            current--;

            if (current < 0) {
                current = images.length - 1;
            }

            showImage();

        }

    </script>

</body>

</html>
