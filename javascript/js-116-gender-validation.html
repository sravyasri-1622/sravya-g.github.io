<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Validation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        .box {
            max-width: 400px;
            margin: auto;
            padding: 25px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Gender Selection</h2>

    <label>
        <input type="radio" name="gender" value="Male"> Male
    </label>

    <label>
        <input type="radio" name="gender" value="Female"> Female
    </label>

    <label>
        <input type="radio" name="gender" value="Other"> Other
    </label>

    <br>

    <button onclick="checkGender()">Submit</button>

    <p id="result"></p>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function checkGender() {

    let gender = document.querySelector('input[name="gender"]:checked');
    let result = document.getElementById("result");

    if (gender) {
        result.textContent = "Selected gender: " + gender.value;
    } else {
        result.textContent = "Please select a gender.";
    }
}
</script>

</body>
</html>
