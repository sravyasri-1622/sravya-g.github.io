<!DOCTYPE html>
<html>
<head>
    <title>Location Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Location Object</h1>

    <p id="output"></p>

    <button onclick="showLocation()">Show Location</button>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function showLocation() {
    let locationInfo =
        "Host: " + location.host +
        "<br>Hostname: " + location.hostname +
        "<br>Protocol: " + location.protocol +
        "<br>Path: " + location.pathname;

    document.getElementById("output").innerHTML = locationInfo;
}
</script>

</body>
</html>
