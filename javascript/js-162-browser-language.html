<!DOCTYPE html>
<html>
<head>
    <title>Browser Language</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        #language {
            font-size: 30px;
            margin: 25px;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Browser Language</h1>

    <div id="language"></div>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
document.getElementById("language").innerHTML =
    navigator.language;
</script>

</body>
</html>
