<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Largest of Three Numbers</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background: #f7971e;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Largest of Three Numbers</h1>

        <input type="number" id="a" placeholder="Number 1">
        <input type="number" id="b" placeholder="Number 2">
        <input type="number" id="c" placeholder="Number 3">

        <br><br>

        <button onclick="findLargest()">Find Largest</button>

        <p id="output"></p>

        <a href="index.html">← Back to JavaScript Programs</a>

    </div>

    <script>

        function findLargest() {

            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            let c = Number(document.getElementById("c").value);

            let largest = Math.max(a, b, c);

            document.getElementById("output").innerHTML =
                "Largest number is: " + largest;
        }

    </script>

</body>

</html>
