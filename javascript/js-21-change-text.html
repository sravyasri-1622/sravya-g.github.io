<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Text</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Change Text Using JavaScript</h1>

        <p id="message">
            This is the original text.
        </p>

        <button onclick="changeText()">
            Change Text
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function changeText() {

            document.getElementById("message").innerHTML =
                "The text has been changed using JavaScript!";

        }

    </script>

</body>

</html>
