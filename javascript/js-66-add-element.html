<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Element Dynamically</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #list {
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Add Element Dynamically</h1>

        <p>Click the button to add a new paragraph.</p>

        <button onclick="addElement()">
            Add Element
        </button>

        <div id="list"></div>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function addElement() {

            let newElement = document.createElement("p");

            newElement.innerHTML =
                "This paragraph was created using JavaScript.";

            document.getElementById("list").appendChild(newElement);

        }

    </script>

</body>

</html>
