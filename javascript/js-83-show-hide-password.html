<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Show Hide Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input {
            padding: 12px;
            width: 80%;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Show / Hide Password</h1>

        <input type="password"
            id="password"
            placeholder="Enter password">

        <br>

        <button onclick="togglePassword()">
            Show Password
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function togglePassword() {

            let password =
                document.getElementById("password");

            let button =
                event.target;

            if (password.type === "password") {

                password.type = "text";
                button.innerText = "Hide Password";

            } else {

                password.type = "password";
                button.innerText = "Show Password";

            }

        }

    </script>

</body>

</html>
