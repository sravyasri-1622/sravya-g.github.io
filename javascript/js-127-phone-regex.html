<!DOCTYPE html>
<html>
<head>
    <title>Phone Regex Validation</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
        }

        .box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }

        button {
            background: #222;
            color: white;
            border: none;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Phone Number Validation</h2>

    <input type="text" id="phone" placeholder="Enter 10-digit phone number">

    <button onclick="validatePhone()">Validate</button>

    <p id="msg"></p>

    <a href="index.html">Back to Programs</a>
</div>

<script>
function validatePhone() {
    let phone = document.getElementById("phone").value;
    let pattern = /^[0-9]{10}$/;

    if (pattern.test(phone)) {
        document.getElementById("msg").innerHTML = "Valid Phone Number";
        document.getElementById("msg").style.color = "green";
    } else {
        document.getElementById("msg").innerHTML = "Invalid Phone Number";
        document.getElementById("msg").style.color = "red";
    }
}
</script>

</body>
</html>
