<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Fibonacci Series</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        input {
            padding: 12px;
        }

        button {
            padding: 12px 20px;
            background: #f7971e;
            color: white;
            border: none;
            border-radius: 7px;
        }

        #output {
            margin-top: 20px;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Fibonacci Series</h1>

        <input type="number" id="number" placeholder="Number of terms">

        <button onclick="generateFibonacci()">Generate</button>

        <p id="output"></p>

        <a href="index.html">← Back to JavaScript Programs</a>

    </div>

    <script>

        function generateFibonacci() {

            let n = Number(document.getElementById("number").value);

            let a = 0;
            let b = 1;
            let result = "";

            for (let i = 1; i <= n; i++) {

                result += a + " ";

                let next = a + b;
                a = b;
                b = next;
            }

            document.getElementById("output").innerHTML =
                "Fibonacci Series:<br>" + result;
        }

    </script>

</body>

</html>
