<!DOCTYPE html>
<html>
<head>
    <title>Online Offline Detection</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        #status {
            font-size: 25px;
            margin: 20px;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Online / Offline Detection</h1>

    <div id="status"></div>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function checkStatus() {
    if (navigator.onLine) {
        document.getElementById("status").innerHTML =
            "Browser is Online";
    } else {
        document.getElementById("status").innerHTML =
            "Browser is Offline";
    }
}

checkStatus();
</script>

</body>
</html>
