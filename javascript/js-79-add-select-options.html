<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Options Dynamically</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input {
            padding: 10px;
            width: 70%;
        }

        button {
            padding: 10px 15px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        select {
            margin-top: 20px;
            padding: 10px;
            width: 80%;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Add Select Options</h1>

        <input type="text"
            id="optionText"
            placeholder="Enter an option">

        <button onclick="addOption()">
            Add
        </button>

        <br>

        <select id="mySelect">
            <option>Select an option</option>
        </select>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function addOption() {

            let text =
                document.getElementById("optionText").value;

            if (text === "") {

                alert("Please enter an option.");
                return;

            }

            let option =
                document.createElement("option");

            option.text = text;

            document.getElementById("mySelect")
                .appendChild(option);

            document.getElementById("optionText")
                .value = "";

        }

    </script>

</body>

</html>
