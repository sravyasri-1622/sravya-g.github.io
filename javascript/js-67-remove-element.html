<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Remove Element Dynamically</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        #message {
            background: #e0f2fe;
            padding: 20px;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Remove Element Dynamically</h1>

        <p id="message">
            This element will be removed.
        </p>

        <button onclick="removeElement()">
            Remove Element
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function removeElement() {

            let element = document.getElementById("message");

            element.remove();

        }

    </script>

</body>

</html>
