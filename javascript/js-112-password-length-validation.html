<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Length Validation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<h2>Password Length Validation</h2>

<input type="password" id="password" placeholder="Enter password">
<button onclick="checkPassword()">Check</button>

<p id="result"></p>

<a href="index.html">← Back to Programs</a>

<script>
function checkPassword() {

    let password = document.getElementById("password").value;
    let result = document.getElementById("result");

    if (password.length >= 8) {
        result.textContent = "Password is valid.";
    } else {
        result.textContent = "Password must contain at least 8 characters.";
    }
}
</script>

</body>
</html>
