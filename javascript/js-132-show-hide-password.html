<!DOCTYPE html>
<html>
<head>
    <title>Show Hide Password</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
        }

        .box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Show / Hide Password</h2>

    <input type="password" id="password" placeholder="Enter password">

    <label>
        <input type="checkbox" onclick="showPassword()">
        Show Password
    </label>

    <a href="index.html">Back to Programs</a>
</div>

<script>
function showPassword() {
    let password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>

</body>
</html>
