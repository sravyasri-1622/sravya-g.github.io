<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Capturing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        #parent {
            background: #dbeafe;
            padding: 40px;
            border-radius: 10px;
        }

        #child {
            background: #7c3aed;
            color: white;
            padding: 25px;
            border-radius: 8px;
        }

        #output {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            display: block;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Event Capturing</h1>

        <div id="parent">

            Parent

            <div id="child">
                Click Me
            </div>

        </div>

        <p id="output">
            Click the child element.
        </p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        document.getElementById("parent")
            .addEventListener("click", function () {

                document.getElementById("output").innerText =
                    "Parent event executed during capturing.";

            }, true);

        document.getElementById("child")
            .addEventListener("click", function () {

                document.getElementById("output").innerText =
                    "Child event executed.";

            });

    </script>

</body>

</html>
