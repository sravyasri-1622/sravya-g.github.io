<!DOCTYPE html>
<html>
<head>
    <title>JavaScript - GCD</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #result {
            margin: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        a {
            display: block;
            margin: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>GCD Calculator</h1>

    <input type="number" id="num1" placeholder="First number">

    <input type="number" id="num2" placeholder="Second number">

    <button onclick="findGCD()">Find GCD</button>

    <div id="result"></div>

    <a href="index.html">← Back to JavaScript Programs</a>
    <a href="../index.html">← Home</a>

</div>

<script>

function findGCD() {

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    while (b !== 0) {

        let temp = b;
        b = a % b;
        a = temp;
    }

    document.getElementById("result").innerHTML =
        "GCD = " + Math.abs(a);
}

</script>

</body>
</html>
