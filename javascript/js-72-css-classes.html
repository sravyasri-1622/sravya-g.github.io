<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Classes Using JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        #message {
            padding: 20px;
            border-radius: 8px;
            background: #e5e7eb;
        }

        .highlight {
            background: #fef3c7 !important;
            color: #92400e;
            font-weight: bold;
            border: 2px solid #f59e0b;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .add {
            background: #16a34a;
        }

        .remove {
            background: #dc2626;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>CSS Classes Using JavaScript</h1>

        <p id="message">
            This element can have a CSS class added or removed.
        </p>

        <button class="add" onclick="addClass()">
            Add Class
        </button>

        <button class="remove" onclick="removeClass()">
            Remove Class
        </button>

        <br>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function addClass() {

            document.getElementById("message")
                .classList.add("highlight");

        }

        function removeClass() {

            document.getElementById("message")
                .classList.remove("highlight");

        }

    </script>

</body>

</html>
