<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Power of a Number</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input,
        button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #16a34a;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Power of a Number</h1>

        <input type="number" id="base" placeholder="Base">

        <input type="number" id="exponent" placeholder="Exponent">

        <button onclick="calculatePower()">Calculate</button>

        <p id="result"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function calculatePower() {

            let base = Number(document.getElementById("base").value);
            let exponent = Number(document.getElementById("exponent").value);

            let result = Math.pow(base, exponent);

            document.getElementById("result").innerHTML =
                base + " raised to " + exponent + " = " + result;

        }

    </script>

</body>

</html>
