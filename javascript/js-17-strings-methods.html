<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>String Methods</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 700px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        input {
            width: 80%;
            padding: 12px;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            background: #f7971e;
            color: white;
            border: none;
            border-radius: 7px;
        }

        #output {
            margin-top: 20px;
            text-align: left;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>String Methods</h1>

        <input type="text" id="text" placeholder="Enter a string">

        <br>

        <button onclick="showMethods()">Show Methods</button>

        <div id="output"></div>

        <a href="index.html">← Back to JavaScript Programs</a>

    </div>

    <script>

        function showMethods() {

            let text = document.getElementById("text").value;

            document.getElementById("output").innerHTML =
                "Original: " + text + "<br>" +
                "Length: " + text.length + "<br>" +
                "Uppercase: " + text.toUpperCase() + "<br>" +
                "Lowercase: " + text.toLowerCase() + "<br>" +
                "First Character: " + text.charAt(0);
        }

    </script>

</body>

</html>
