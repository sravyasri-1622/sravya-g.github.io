<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sort Table Records</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        button {
            padding: 10px 20px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ccc;
        }

        th {
            background: #2563eb;
            color: white;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Sort Student Records</h1>

        <button onclick="sortTable()">
            Sort by Marks
        </button>

        <table id="studentTable">

            <tr>
                <th>Name</th>
                <th>Marks</th>
            </tr>

            <tr>
                <td>Sravya</td>
                <td>78</td>
            </tr>

            <tr>
                <td>Prasanna</td>
                <td>92</td>
            </tr>

            <tr>
                <td>Deekshitha</td>
                <td>85</td>
            </tr>

            <tr>
                <td>Thrishika</td>
                <td>95</td>
            </tr>

        </table>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function sortTable() {

            let table =
                document.getElementById("studentTable");

            let rows =
                Array.from(table.rows).slice(1);

            rows.sort(function (a, b) {

                let marksA =
                    Number(a.cells[1].innerText);

                let marksB =
                    Number(b.cells[1].innerText);

                return marksB - marksA;

            });

            for (let i = 0; i < rows.length; i++) {

                table.appendChild(rows[i]);

            }

        }

    </script>

</body>

</html>
