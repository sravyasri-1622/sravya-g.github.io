<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Largest and Smallest Array Element</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        input {
            width: 80%;
            padding: 12px;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            background: #f7971e;
            color: white;
            border: none;
            border-radius: 7px;
        }

        #output {
            margin-top: 20px;
            font-weight: bold;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Largest and Smallest Element</h1>

        <p>Enter numbers separated by commas</p>

        <input type="text" id="numbers" placeholder="10, 25, 5, 40, 15">

        <br>

        <button onclick="findValues()">Find</button>

        <div id="output"></div>

        <a href="index.html">← Back to JavaScript Programs</a>

    </div>

    <script>

        function findValues() {

            let input = document.getElementById("numbers").value;

            let numbers = input.split(",").map(Number);

            let largest = Math.max(...numbers);
            let smallest = Math.min(...numbers);

            document.getElementById("output").innerHTML =
                "Largest = " + largest + "<br>" +
                "Smallest = " + smallest;
        }

    </script>

</body>

</html>
