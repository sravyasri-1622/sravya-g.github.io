<!DOCTYPE html>
<html>
<head>
    <title>JavaScript - Dynamic API Data</title>

    <style>
        body {
            font-family: Arial;
            background: #f8fafc;
            padding: 30px 20px;
        }

        .box {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .post {
            padding: 15px;
            margin: 15px 0;
            background: #eef2ff;
            border-radius: 10px;
        }

        a {
            display: block;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Dynamic API Data</h1>

    <button onclick="loadPosts()">Load Posts</button>

    <div id="posts"></div>

    <a href="index.html">← Back to JavaScript Programs</a>
    <a href="../index.html">← Home</a>

</div>

<script>

function loadPosts() {

    fetch("https://jsonplaceholder.typicode.com/posts?_limit=5")

    .then(function(response) {
        return response.json();
    })

    .then(function(data) {

        let output = "";

        for (let i = 0; i < data.length; i++) {

            output +=
                "<div class='post'>" +
                "<h3>" + data[i].title + "</h3>" +
                "<p>" + data[i].body + "</p>" +
                "</div>";
        }

        document.getElementById("posts").innerHTML = output;
    });
}

</script>

</body>
</html>
