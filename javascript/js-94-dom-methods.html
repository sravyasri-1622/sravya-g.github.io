<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Methods</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 650px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        .item {
            padding: 12px;
            margin: 8px;
            background: #eff6ff;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>DOM Methods</h1>

        <div id="container">

            <p class="item">
                Original Element
            </p>

        </div>

        <button onclick="createElementDemo()">
            createElement()
        </button>

        <button onclick="removeElementDemo()">
            remove()
        </button>

        <button onclick="replaceElementDemo()">
            replaceChild()
        </button>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function createElementDemo() {

            let newElement =
                document.createElement("p");

            newElement.className = "item";

            newElement.innerText =
                "New element created dynamically.";

            document.getElementById("container")
                .appendChild(newElement);

        }


        function removeElementDemo() {

            let elements =
                document.getElementsByClassName("item");

            if (elements.length > 1) {

                elements[elements.length - 1].remove();

            }

        }


        function replaceElementDemo() {

            let container =
                document.getElementById("container");

            let oldElement =
                container.firstElementChild;

            let newElement =
                document.createElement("p");

            newElement.className = "item";

            newElement.innerText =
                "The original element was replaced.";

            container.replaceChild(
                newElement,
                oldElement
            );

        }

    </script>

</body>

</html>
