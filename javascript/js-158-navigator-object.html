<!DOCTYPE html>
<html>
<head>
    <title>Navigator Object</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 650px;
            margin: auto;
            border-radius: 15px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Navigator Object</h1>

    <p id="output"></p>

    <button onclick="showNavigator()">Show Navigator Info</button>

    <a href="index.html">← Back to Programs</a>
</div>

<script>
function showNavigator() {
    document.getElementById("output").innerHTML =
        "Browser: " + navigator.appName +
        "<br>Platform: " + navigator.platform +
        "<br>Language: " + navigator.language +
        "<br>Online: " + navigator.onLine;
}
</script>

</body>
</html>
