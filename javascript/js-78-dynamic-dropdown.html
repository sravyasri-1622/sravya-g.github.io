<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Dropdown</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        select,
        button {
            padding: 12px;
            margin: 10px;
            width: 80%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Dynamic Dropdown</h1>

        <select id="course">
            <option value="">Select Course</option>
        </select>

        <button onclick="showCourse()">
            Show Selected Course
        </button>

        <p id="result"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        let courses = [
            "CSE",
            "AI & ML",
            "Data Science",
            "Cyber Security",
            "ECE"
        ];

        let dropdown =
            document.getElementById("course");

        for (let i = 0; i < courses.length; i++) {

            let option =
                document.createElement("option");

            option.text = courses[i];
            option.value = courses[i];

            dropdown.appendChild(option);

        }

        function showCourse() {

            let value = dropdown.value;

            document.getElementById("result").innerText =
                value === ""
                    ? "Please select a course."
                    : "Selected Course: " + value;

        }

    </script>

</body>

</html>
