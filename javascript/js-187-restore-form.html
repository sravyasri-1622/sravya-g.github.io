<!DOCTYPE html>
<html>
<head>
    <title>Restore Form after Refresh</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Restore Form after Refresh</h1>

    <input type="text" id="name" placeholder="Enter name">
    <br>

    <input type="email" id="email" placeholder="Enter email">
    <br>

    <button onclick="saveData()">Save Data</button>

    <p id="result"></p>

    <br>
    <a href="index.html">← Back to Programs</a>

    <script>
        document.getElementById("name").value =
            localStorage.getItem("formName") || "";

        document.getElementById("email").value =
            localStorage.getItem("formEmail") || "";

        function saveData() {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;

            localStorage.setItem("formName", name);
            localStorage.setItem("formEmail", email);

            document.getElementById("result").innerHTML =
                "Data saved. Refresh the page to restore it.";
        }
    </script>

</body>
</html>
