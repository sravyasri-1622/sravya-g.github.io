<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Count Digits</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        input,
        button {
            padding: 10px;
            margin: 8px;
        }

        button {
            background: #dc2626;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Count Number of Digits</h1>

        <input type="number" id="number">

        <button onclick="countDigits()">Count</button>

        <p id="result"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function countDigits() {

            let number = document.getElementById("number").value;

            let count = String(Math.abs(Number(number))).length;

            document.getElementById("result").innerHTML =
                "Number of digits = " + count;

        }

    </script>

</body>

</html>
