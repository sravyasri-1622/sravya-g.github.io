<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Current Date and Time</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #ccc;
        }

        #date {
            font-size: 25px;
            color: #2563eb;
            font-weight: bold;
        }

        a {
            display: block;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Current Date & Time</h1>

        <p id="date"></p>

        <a href="index.html">Back to Programs</a>

    </div>

    <script>

        function showDateTime() {

            let now = new Date();

            document.getElementById("date").innerText =
                now.toLocaleString();

        }

        showDateTime();

        setInterval(showDateTime, 1000);

    </script>

</body>

</html>
