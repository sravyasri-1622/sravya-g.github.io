<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Selectors</title>

    <style>

        /* Element selector */
        p {
            font-size: 18px;
        }

        /* ID selector */
        #heading {
            color: blue;
        }

        /* Class selector */
        .highlight {
            background-color: yellow;
            padding: 10px;
        }

        /* Group selector */
        h2, h3 {
            color: green;
        }

    </style>

</head>

<body>

    <h1 id="heading">CSS Selectors</h1>

    <a href="index.html">Back to Programs</a>

    <hr>

    <h2>Element Selector</h2>

    <p>
        This paragraph is styled using an element selector.
    </p>

    <h2>Class Selector</h2>

    <p class="highlight">
        This paragraph uses a class selector.
    </p>

    <h3>Group Selector</h3>

    <p>
        Multiple elements can be styled together.
    </p>

</body>

</html>
