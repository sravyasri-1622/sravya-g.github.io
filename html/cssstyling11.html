<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Styling</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: darkgreen;
            font-size: 18px;
        }

        .box {
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }

    </style>

</head>

<body>

    <h1>CSS Styling Example</h1>

    <a href="index.html">Back to Programs</a>

    <hr>

    <div class="box">

        <h2>Styled Content</h2>

        <p>
            This page demonstrates CSS properties such as
            colors, fonts, margins, padding and borders.
        </p>

    </div>

</body>

</html>
