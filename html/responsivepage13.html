<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Responsive Webpage</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .box {
            flex: 1;
            padding: 30px;
            background-color: lightgray;
            text-align: center;
        }

        @media screen and (max-width: 600px) {

            .container {
                flex-direction: column;
            }

            header {
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

    <header>

        <h1>Responsive Webpage</h1>

        <p>This webpage adjusts to different screen sizes.</p>

    </header>

    <nav>

        <a href="index.html">Back to Programs</a>

    </nav>

    <main class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of webpage.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Style of webpage.</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Functionality of webpage.</p>
        </div>

    </main>

</body>

</html>
