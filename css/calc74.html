<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 74 - Calc Function</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: calc(100% - 40px);
            max-width: 900px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
        }

        .box {
            width: calc(100% - 60px);
            margin: 30px;
            padding: 30px;
            background: #2563eb;
            color: white;
            border-radius: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                width: calc(100% - 20px);
                padding: 25px;
            }

            .box {
                width: calc(100% - 30px);
                margin: 15px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
</nav>

<div class="container">

    <h1>CSS calc() Function</h1>

    <p>
        The calc() function allows CSS to perform calculations
        while determining sizes.
    </p>

    <div class="box">
        Width calculated using calc()
    </div>

</div>

</body>
</html>
