<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1e293b;
            text-shadow: 3px 3px 5px #aaa;
        }

        .card {
            width: 300px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>

    <h1>CSS Shadows</h1>

    <div class="card">
        <h2>Box Shadow</h2>
        <p>This card uses box-shadow.</p>
    </div>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
