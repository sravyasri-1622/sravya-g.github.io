<!DOCTYPE html>
<html>
<head>
    <title>Website Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #444;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 20px;
            text-decoration: none;
        }

        .hero {
            padding: 80px;
            text-align: center;
            background-color: lightblue;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .card {
            padding: 30px;
            width: 200px;
            background-color: white;
            border: 1px solid gray;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">
        <h1>Welcome to My Website</h1>
        <p>A simple website created using HTML and CSS.</p>
    </section>

    <section class="cards">

        <div class="card">
            <h2>HTML</h2>
            <p>Structure of webpages.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Style of webpages.</p>
        </div>

        <div class="card">
            <h2>Web Design</h2>
            <p>Create beautiful websites.</p>
        </div>

    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <br>
    <a href="index.html">← Back to Programs</a>

</body>
</html>
