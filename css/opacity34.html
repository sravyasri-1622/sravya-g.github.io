<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity and Transparency</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eef2ff;
            padding: 30px;
        }

        .box {
            width: 250px;
            padding: 40px;
            margin: 20px auto;
            background: #2563eb;
            color: white;
            border-radius: 12px;
        }

        .opacity {
            opacity: 0.5;
        }

        .transparent {
            background: rgba(37, 99, 235, 0.3);
            color: #111;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="box">
        Normal
    </div>

    <div class="box opacity">
        50% Opacity
    </div>

    <div class="box transparent">
        Transparent Background
    </div>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
