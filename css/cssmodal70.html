<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 70 - Modal Popup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f8fafc;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            margin: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 80px;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal:target {
            display: flex;
        }

        .modal-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            max-width: 450px;
        }

        .close {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
</nav>

<h1>CSS-Only Modal</h1>

<a href="#popup" class="button">Open Popup</a>

<div class="modal" id="popup">

    <div class="modal-box">

        <h2>Welcome!</h2>

        <p>
            This popup is created using only HTML and CSS.
            No JavaScript is required.
        </p>

        <a href="#" class="close">Close</a>

    </div>

</div>

</body>
</html>
