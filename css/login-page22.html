<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        .login {
            width: 300px;
            margin: 80px auto;
            padding: 25px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="login">

        <h2>Login</h2>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Login</button>

    </div>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
