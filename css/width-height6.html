<!DOCTYPE html>
<html>
<head>
    <title>Width Height Sizing</title>

    <style>
        .box1 {
            width: 200px;
            height: 100px;
            background-color: lightblue;
        }

        .box2 {
            width: 50%;
            height: 100px;
            background-color: lightgreen;
        }

        .box3 {
            max-width: 500px;
            min-height: 100px;
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <h1>Width, Height and Sizing</h1>

    <div class="box1">200px × 100px</div>
    <br>

    <div class="box2">50% Width</div>
    <br>

    <div class="box3">Min Height and Max Width</div>

    <br>
    <a href="index.html">← Back to Programs</a>

</body>
</html>
