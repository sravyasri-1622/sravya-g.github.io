<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        img {
            float: left;
            width: 150px;
            margin-right: 20px;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

    <h1>Float and Clear</h1>

    <img src="../assets/images/web.jpg">

    <p>
        This text flows around the image because the image is floated left.
    </p>

    <p class="clear">
        This paragraph uses clear: both.
    </p>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
