<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 71 - Dark Mode</title>

    <style>
        :root {
            --background: #f8fafc;
            --text: #111827;
            --card: white;
            --accent: #2563eb;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            transition: 0.3s;
        }

        nav {
            background: var(--text);
            padding: 20px 8%;
        }

        nav a {
            color: var(--background);
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 800px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: var(--card);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .dark {
            --background: #111827;
            --text: #f8fafc;
            --card: #1f2937;
            --accent: #60a5fa;
        }

        #mode {
            display: none;
        }

        #mode:checked ~ .page {
            --background: #111827;
            --text: #f8fafc;
            --card: #1f2937;
        }

        .toggle {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .page {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<input type="checkbox" id="mode">

<div class="page">

    <nav>
        <a href="../index.html">Home</a>
        <a href="index.html">CSS Programs</a>
    </nav>

    <div class="container">

        <div class="card">

            <h1>Dark Mode</h1>

            <p>
                Click the button to switch between light and dark
                appearance using CSS variables.
            </p>

            <label for="mode" class="toggle">
                Toggle Theme
            </label>

        </div>

    </div>

</div>

</body>
</html>
