<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        @media screen and (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <img src="../assets/images/web.jpg">
        <img src="../assets/images/web.jpg">
        <img src="../assets/images/web.jpg">
        <img src="../assets/images/web.jpg">
        <img src="../assets/images/web.jpg">
        <img src="../assets/images/web.jpg">

    </div>

    <br>
    <a href="index.html">← Back to Programs</a>

</body>
</html>
