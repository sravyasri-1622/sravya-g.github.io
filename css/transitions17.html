<!DOCTYPE html>
<html>
<head>
    <title>Transitions and Transformations</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background-color: lightblue;
            transition: 0.5s;
        }

        .box:hover {
            transform: rotate(20deg) scale(1.2);
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>Transitions and Transformations</h1>

    <div class="box"></div>

</body>
</html>
