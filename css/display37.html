<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .block {
            display: block;
            background: #dbeafe;
            padding: 15px;
            margin: 10px;
        }

        .inline {
            display: inline;
            background: #dcfce7;
            padding: 10px;
        }

        .inline-block {
            display: inline-block;
            background: #fef3c7;
            padding: 20px;
            margin: 10px;
        }

        .none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>CSS Display Properties</h1>

    <div class="block">Block Element</div>

    <span class="inline">Inline Element</span>

    <div class="inline-block">Inline-block Element</div>

    <div class="none">This element is hidden using display:none.</div>

    <p>
        The last element is not displayed because display is set to none.
    </p>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
