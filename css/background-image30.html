<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Images</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 400px;

            background-image:
                linear-gradient(
                    rgba(0,0,0,0.5),
                    rgba(0,0,0,0.5)
                ),
                url("../assets/images/web.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;
        }

        .content {
            padding: 30px;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="content">
            <h1>Web Development</h1>
            <p>Background image with center positioning.</p>
        </div>

    </section>

    <br>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
