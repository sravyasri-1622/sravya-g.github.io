<!DOCTYPE html>
<html>
<head>
    <title>CSS Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
        }

        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>CSS Lists and Tables</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <table>
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Sravya</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Prasanna</td>
            <td>88</td>
        </tr>
    </table>

    <br>
    <a href="index.html">← Back to Programs</a>

</body>
</html>
