<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f7fa;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }

        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

        <img src="../assets/images/web.jpg" alt="Image 1">
        <img src="../assets/images/web.jpg" alt="Image 2">
        <img src="../assets/images/web.jpg" alt="Image 3">
        <img src="../assets/images/web.jpg" alt="Image 4">
        <img src="../assets/images/web.jpg" alt="Image 5">
        <img src="../assets/images/web.jpg" alt="Image 6">
        <img src="../assets/images/web.jpg" alt="Image 7">
        <img src="../assets/images/web.jpg" alt="Image 8">

    </div>

    <br>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
