<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 66 - Transformations</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            text-align: center;
            padding: 40px;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
            margin-top: 70px;
        }

        .box {
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            border-radius: 15px;
            transition: transform 0.5s;
        }

        .two-d:hover {
            transform: rotate(25deg) scale(1.1);
        }

        .three-d:hover {
            transform: perspective(500px) rotateY(45deg);
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
</nav>

<h1>2D and 3D Transformations</h1>

<div class="container">

    <div class="box two-d">
        2D Transform
    </div>

    <div class="box three-d">
        3D Transform
    </div>

</div>

</body>
</html>
