<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 62 - Flexbox Alignment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding: 30px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 20px;
        }

        .flex-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 300px;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        .box {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            border-radius: 12px;
        }

        .one {
            order: 3;
        }

        .two {
            order: 1;
        }

        .three {
            order: 2;
        }

        @media (max-width: 600px) {
            .flex-container {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
</nav>

<h1>Flexbox Alignment and Ordering</h1>

<div class="flex-container">

    <div class="box one">1</div>
    <div class="box two">2</div>
    <div class="box three">3</div>

</div>

</body>
</html>
