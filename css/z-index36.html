<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .area {
            position: relative;
            height: 350px;
        }

        .box {
            width: 180px;
            height: 180px;
            position: absolute;
            padding: 20px;
            color: white;
            box-sizing: border-box;
        }

        .one {
            background: #2563eb;
            top: 50px;
            left: 35%;
            z-index: 1;
        }

        .two {
            background: #dc2626;
            top: 100px;
            left: 45%;
            z-index: 2;
        }

        .three {
            background: #16a34a;
            top: 150px;
            left: 40%;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h1>Z-index and Stacking Order</h1>

    <div class="area">

        <div class="box one">Z-index: 1</div>

        <div class="box two">Z-index: 2</div>

        <div class="box three">Z-index: 3</div>

    </div>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
