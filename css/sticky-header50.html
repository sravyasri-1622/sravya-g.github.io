<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.8;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: #172033;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #2563eb;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .content {
            padding: 40px;
        }

        .section {
            min-height: 500px;
            padding: 30px;
            margin-bottom: 20px;
            background: #f5f7fa;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
        </nav>
    </header>

    <main class="content">

        <section id="home" class="section">
            <h2>Home</h2>
            <p>
                Scroll down to see the sticky header.
            </p>
        </section>

        <section id="about" class="section">
            <h2>About</h2>
            <p>
                The header remains at the top while scrolling.
            </p>
        </section>

        <section id="services" class="section">
            <h2>Services</h2>
            <p>
                This demonstrates position: sticky.
            </p>
        </section>

    </main>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
