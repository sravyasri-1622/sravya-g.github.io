<!DOCTYPE html>
<html>
<head>
    <title>CSS Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
        }

        .box {
            background-color: lightblue;
            padding: 40px;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox</h1>

    <div class="container">
        <div class="box">HTML</div>
        <div class="box">CSS</div>
        <div class="box">JavaScript</div>
    </div>

    <br>

</body>
</html>
