<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 72 - Responsive Typography</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding: 30px;
        }

        nav a {
            color: #2563eb;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            max-width: 900px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
        }

        h1 {
            font-size: 8vw;
            max-width: 800px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.7;
        }

        @media (min-width: 1000px) {
            h1 {
                font-size: 70px;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="../index.html">Home</a>
    <a href="index.html">CSS Programs</a>
</nav>

<div class="container">

    <h1>Responsive Typography</h1>

    <p>
        The heading changes its size according to the screen width.
        This makes text more adaptable across different devices.
    </p>

</div>

</body>
</html>
