<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        .card {
            width: 250px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 15px;
        }

        .card img {
            width: 100%;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="../assets/images/web.jpg">

        <h2>Web Development Course</h2>

        <p>Learn HTML and CSS.</p>

        <p class="price">₹999</p>

        <button>Buy Now</button>

    </div>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
