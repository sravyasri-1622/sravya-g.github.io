<!DOCTYPE html>
<html>
<head>
    <title>CSS Media Queries</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
        }

        @media screen and (max-width: 600px) {
            body {
                background-color: lightpink;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Webpage</h1>

    <p>Resize the browser window to see the change.</p>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
