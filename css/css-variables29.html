<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables</title>

    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #eff6ff;
            --text-color: #1e293b;
            --spacing: 20px;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: var(--secondary-color);
            color: var(--text-color);
        }

        header {
            background: var(--primary-color);
            color: white;
            padding: var(--spacing);
            text-align: center;
        }

        .card {
            margin: var(--spacing);
            padding: var(--spacing);
            background: white;
            border-radius: 12px;
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>CSS Variables</h1>
    </header>

    <div class="card">
        <h2>Custom Properties</h2>
        <p>
            This webpage uses CSS variables for colors and spacing.
        </p>

        <button>Learn More</button>
    </div>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
