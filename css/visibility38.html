<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .visible {
            padding: 20px;
            background: #dcfce7;
        }

        .hidden {
            visibility: hidden;
            padding: 20px;
            background: #fee2e2;
        }

        .display-none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>Visibility and Hiding</h1>

    <div class="visible">
        This element is visible.
    </div>

    <div class="hidden">
        This element is hidden using visibility:hidden.
    </div>

    <div class="display-none">
        This element uses display:none.
    </div>

    <p>
        visibility:hidden keeps the space, while display:none removes the space.
    </p>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
