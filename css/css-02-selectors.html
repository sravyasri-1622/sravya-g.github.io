<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        p {
            color: blue;
        }

        .highlight {
            background-color: yellow;
        }

        #special {
            color: red;
        }

        h1, h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2>Different Selectors</h2>

    <p>Element selector</p>

    <p class="highlight">Class selector</p>

    <p id="special">ID selector</p>

</body>
</html>
