<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation</title>

    <style>
        nav {
            display: flex;
            justify-content: space-around;
            background-color: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        @media screen and (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Navigation Menu</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <br>
    <a href="index.html">← Back to Programs</a>

</body>
</html>
