<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit and Position</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .container img {
            width: 300px;
            height: 200px;
            border-radius: 12px;
        }

        .cover {
            object-fit: cover;
            object-position: center;
        }

        .contain {
            object-fit: contain;
            background: #e5e7eb;
        }
    </style>
</head>

<body>

    <h1>Object-fit and Object-position</h1>

    <div class="container">

        <div>
            <h3>Cover</h3>
            <img
                src="../assets/images/web.jpg"
                class="cover"
                alt="Cover">
        </div>

        <div>
            <h3>Contain</h3>
            <img
                src="../assets/images/web.jpg"
                class="contain"
                alt="Contain">
        </div>

    </div>

    <br>

    <a href="index.html">← Back to Programs</a>

</body>
</html>
